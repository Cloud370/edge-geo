name: Update GeoIP Database

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    name: Update D1 Database
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create tmp directory
        run: mkdir -p tmp

      - name: Download GeoIP Database via gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R P3TERX/GeoLite.mmdb -p "GeoLite2-City.mmdb" --output tmp/GeoLite2-City.mmdb || \
          wget -O tmp/GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb

      - name: Process GeoIP Data
        run: npx tsx scripts/process-geoip.ts
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

      - name: Update D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
            # Parallel execution for speed? No, D1 might lock.
            # But we can try to optimize by batching if possible, but wrangler handles it.
            .github/scripts/apply-updates.sh
